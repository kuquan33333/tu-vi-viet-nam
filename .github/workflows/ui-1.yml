name: UI-1 visual QA
on:
  pull_request:
    branches: [revamp-v2]
permissions:
  contents: read
jobs:
  visual:
    if: github.head_ref == 'ui/01-design-system-shell'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://lichvannien-9sv.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.phase == 'before' && '565bda16c47f260c2b31f0005b02545ca1a5b3a9' || github.event.pull_request.head.sha }}
          path: subject
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: subject/package-lock.json
      - name: Install and build pinned subject
        working-directory: subject
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          node scripts/prepare-cloudflare-demo.mjs
          npm run build
      - name: Serve static export
        working-directory: subject
        run: |
          node scripts/serve-export.mjs > "$RUNNER_TEMP/ui1-server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Capture 11 routes at 360, 768 and 1280 px
        run: |
          npm install --prefix "$RUNNER_TEMP/ui1-qa" --ignore-scripts --no-save --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/ui1-qa/node_modules/.bin/playwright" install chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ui1-qa/node_modules/playwright" node scripts/capture-ui-1.mjs ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-1-${{ matrix.phase }}
          path: qa-artifacts/ui-1-${{ matrix.phase }}
          if-no-files-found: warn
